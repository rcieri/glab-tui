name: Install

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-cargo-install:
    name: cargo install
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Install from crates.io
        run: |
          cargo install glab-tui-crate
          glab-tui --version
          glab-tui --help

  test-docker:
    name: Docker
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and test Docker image
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          docker pull "ghcr.io/rcieri/glab-tui:$TAG"
          docker run --rm "ghcr.io/rcieri/glab-tui:$TAG" --help

  test-install-sh-ubuntu-22-04:
    name: install.sh (ubuntu-22.04 gnu)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Verify glibc baseline
        run: |
          ldd --version | head -n 1
          # Ubuntu 22.04 ships glibc 2.35; the ubuntu-22.04 gnu binary must run.
          ldd --version | head -n 1 | grep -q "2\." || \
            { echo "expected glibc 2.x on ubuntu-22.04 runner"; exit 1; }

      - name: Run install.sh (defaults to ubuntu-22.04 gnu)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p temp-bin
          PREFIX=$PWD/temp-bin ./install.sh
          ./temp-bin/glab-tui --help

  test-install-sh-ubuntu-22-04-musl:
    name: install.sh (musl static binary on ubuntu-22.04)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      # Force install.sh to pick the musl asset (it would default to gnu on ubuntu-22.04).
      - name: Run install.sh with GLAB_TUI_ASSET override
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLAB_TUI_ASSET: glab-tui-linux-amd64-musl.tar.gz
        run: |
          mkdir -p temp-bin
          PREFIX=$PWD/temp-bin ./install.sh
          file ./temp-bin/glab-tui | grep -qi 'statically linked' || \
            { echo "musl binary is not statically linked"; exit 1; }
          ./temp-bin/glab-tui --help

  test-install-sh-ubuntu-24-04:
    name: install.sh (ubuntu-24.04 gnu)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Run install.sh (defaults to ubuntu-24.04 gnu)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p temp-bin
          PREFIX=$PWD/temp-bin ./install.sh
          ./temp-bin/glab-tui --help

  test-install-sh-ubuntu-latest:
    name: install.sh (ubuntu-latest gnu dynamic version)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Print detected Ubuntu version
        run: |
          . /etc/os-release
          echo "Host Ubuntu: ${VERSION_ID}"

      - name: Run install.sh (should pick matching variant or fall back)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p temp-bin
          PREFIX=$PWD/temp-bin ./install.sh
          ./temp-bin/glab-tui --help

  test-install-ps1:
    name: install.ps1
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Run install.ps1
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path temp-bin
          ./install.ps1 -Prefix "$PWD/temp-bin"
          ./temp-bin/glab-tui.exe --help
