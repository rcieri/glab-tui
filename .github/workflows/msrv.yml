name: MSRV

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run weekly to catch MSRV regressions from dep updates
    - cron: "0 8 * * 2"

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Check MSRV
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: rustup toolchain install

      - name: Install cargo-hack
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-hack

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv

      # Checks with the `rust-version` from Cargo.toml, not the toolchain file.
      - name: Check build on MSRV
        run: cargo hack check --rust-version --all-targets --locked
