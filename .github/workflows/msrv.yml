name: MSRV

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run weekly to catch MSRV regressions from dep updates
    - cron: "0 8 * * 2"

env:
  CARGO_TERM_COLOR: always
  # edition 2024 requires Rust >= 1.85, but dependencies require >= 1.88
  MSRV: "1.88"

jobs:
  msrv:
    name: Check MSRV
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install MSRV toolchain (${{ env.MSRV }})
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.MSRV }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv-${{ env.MSRV }}

      - name: Check build on MSRV
        run: cargo check --all-targets
