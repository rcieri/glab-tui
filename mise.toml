[tools]
# Rust toolchain is pinned via rust-toolchain.toml (mise reads it natively).
gh = "latest"
glab = "latest"
jq = "latest"
"cargo:cargo-llvm-cov" = "latest"

[tasks.fmt]
description = "Format code with rustfmt"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check formatting without modifying files (as CI runs it)"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Run Clippy with warnings denied (as CI runs it)"
env = { RUSTFLAGS = "-Dwarnings" }
run = "cargo clippy --all-targets --all-features"

[tasks.test]
description = "Run unit tests"
run = "cargo test --bin glab-tui"

[tasks.e2e]
description = "Run end-to-end tests (single-threaded)"
run = "cargo test --test e2e -- --test-threads=1"

[tasks.check]
description = "Run all CI checks locally (fmt check, clippy, unit tests, e2e tests)"
depends = ["fmt:check", "lint", "test", "e2e"]

[tasks.cov]
description = "Generate code coverage summary"
run = "cargo llvm-cov report --summary-only"

[tasks."cov:lcov"]
description = "Generate code coverage lcov report"
run = "cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info"

[tasks.demos]
description = "Regenerate demo GIFs using VHS (requires vhs, ttyd, ffmpeg)"
run = "bash assets/generate-demos.sh"

[tasks.release-preflight]
description = "Check release prerequisites"
run = "bash scripts/release.sh --help"
